services:
  - type: web
    name: secretaria-backend
    runtime: go
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_TLS
        value: "true"
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false